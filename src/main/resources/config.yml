# ESLink
# 新版本会自动补缺失的键，不会改你已经填过的值。
# /link 大厅    /link chest    /link io    /link settings

config-version: 17
config:
  auto-fill-missing: true

mysql:
  host: 127.0.0.1
  port: 3306
  database: eslink
  user: root
  password: ""

server:
  # 内部代号，唯一，只能字母数字。牌子配对用，玩家界面一般不显示。
  code: ES2
  # 聊天前缀用的短标签，例如 ES2、SNC。空则用 code。
  short: ""
  name: 以太物语
  blurb: Create 机械动力 · 生存建筑
  # 大厅标识：TERRACOTTA 陶瓦 / CONCRETE 混凝土
  icon: TERRACOTTA
  # WHITE LIGHT_GRAY GRAY BLACK BROWN RED ORANGE YELLOW LIME GREEN CYAN LIGHT_BLUE BLUE PURPLE MAGENTA PINK
  color: LIGHT_BLUE

# 空列表 = 允许任意物品。正式请写成 namespaced key，如 minecraft:iron_ingot
whitelist: []

heartbeat-seconds: 5
offline-after-seconds: 20
scan-seconds: 2
sound-cooldown-ticks: 40

# 运输箱。给生产线用：每轮多送几组，路上积压满了就暂停，不炸、不刷屏。
# 不是实时管道。一对箱子大约 2 秒一轮 × stacks-per-scan 组。
chest:
  stacks-per-scan: 4
  queue-limit: 16
  # 所有物品发货倒计时（秒），到点整批发出。0=关闭，立即发。
  batch-delay-seconds: 3
  # 纸箱/潜影盒在基础倒计时上再叠加的额外延迟。0=关掉。东西越多越接近 max。
  heavy-delay-seconds: 3
  heavy-max-seconds: 8
  # 对面没有的模组附魔/属性：deliver=照样给（lore 写丢了什么，带回原服可恢复）；refuse=当缺物品
  unknown-extra: deliver
  # 潜影盒 / 包裹等带内含的容器。auto=启动自检通过才收发（推荐）；on=强开；off=永不收发
  # 自检结果看 /link diag
  containers: auto

# 全局传输急停。/link transport off 可随时停止一切 chest 收发（游戏内，立即生效）。
transport:
  enabled: true

# 禁用的数据组件 ID（应急隔离问题组件，命中即拦截收发并退回）。
# 例：create:package_contents、create:clipboard_content
blocked-components: []

# 红石：本地每 tick 套用 0–15。跨服按电平变化写入事件表，接收端按时间戳回放。
# 对端掉线 / 超过 stale-ms 没心跳 / 区块没加载 → 输出固定 0。
# 不要设成“每 tick 写 MySQL”。两边 TPS 不同、还有延迟，对不齐，只会打爆库。
io:
  # 出问题时的总开关：false = 完全不跑红石，箱子照常。
  enabled: true
  keepalive-ms: 1000
  stale-ms: 5000

alerts:
  # 本服有人上架，通知本服所有人
  listing: true
  # 接收其他服务器的上架广播
  listing-remote: true
  # 有人创建运输箱时通知本服管理
  chest-admin: true

trade:
  enabled: true
  # 0.05 = 买家多付 5%，卖家仍收标价
  tax-rate: 0
  # 税入账玩家名；空则尝试用 ES2UniPlugin 的 tax.sink-account；再空则销毁
  sink-account: ""
  # 同一账号在其他服务器取回自己的货：货款不打给自己，只收取回费
  self-buy: true
  self-buy-min-fee: 64
  self-buy-surcharge: 0
  self-buy-cooldown-seconds: 20
  self-buy-daily: 12

# 独立市场服务（Python，自带 SQLite）。未登记时货单仍走上方 MySQL。
# 管理可用 /link market add <代号> <地址> <令牌> [名称]，写入本段并在重启后保留。
markets:
  default: ""
  list: {}
  # 示例：
  # default: ether
  # list:
  #   ether:
  #     name: 以太货栈
  #     url: http://127.0.0.1:8765
  #     token: "change-me"

# 也可给权限 eslink.super。用来删除调试残留的服务器记录。
super-admins: []

chat:
  enabled: true
  default: local
  prefix: "[{short}] "
  max-length: 128
  item: true
  fast-window-seconds: 6
  fast-count: 12
  fast-remind-seconds: 25
